# ====================================
#  BLOSSOM KIDS SECURITY HEADERS
# ====================================

[[headers]]
  for = "/*"
  [headers.values]
    # Block site from being displayed in a frame (Clickjacking protection)
    X-Frame-Options = "DENY"

    # Prevent browsers from MIME-sniffing a response away from the declared content-type
    X-Content-Type-Options = "nosniff"

    # Enable XSS filtering in browsers (Block Cross-Site Scripting)
    X-XSS-Protection = "1; mode=block"

    # Referrer Policy: Don't leak user data to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Strict Transport Security (HSTS): Force HTTPS for 1 year
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy (CSP): The Ultimate Shield
    # Only allow content from trusted sources (Google Fonts, FontAwesome, Web3Forms, etc.)
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://unpkg.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com;
      img-src 'self' data: https:;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      connect-src 'self' https://api.web3forms.com;
      frame-src https://www.google.com https://maps.google.com;
      object-src 'none';
      base-uri 'self';
    """